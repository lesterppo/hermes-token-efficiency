name: caveman
version: "2.2.1"
description: "Mechanical caveman mode — injects compression rules into the system message via llm_request middleware. Stateless per request (strip-then-append): safe for multi-session gateway processes, mid-session level changes, and 'caveman off'. Rules synced to upstream JuliusBrussee/caveman skill v2.4.0. Toggle with CAVEMAN_MODE env var (lite/full/ultra/wenyan-lite/wenyan-full/wenyan-ultra) or 'caveman on/off [level]'."
author: Hermes Agent (adapted from JuliusBrussee/caveman)
hooks: []
provides_hooks: []
middleware:
  - llm_request
